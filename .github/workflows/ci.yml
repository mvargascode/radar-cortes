name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/collectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/collectors/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: radar_cortes
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar_cortes"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar_cortes
      PGPASSWORD: radar
    steps:
      - uses: actions/checkout@v4
      - name: Esquema y seeds
        run: |
          for f in db/migrations/*.sql db/seeds/*.sql; do
            psql -h localhost -U radar -d radar_cortes -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm run typecheck
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.prod.yml
        run: |
          cp .env.prod.example .env.prod
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config -q
      - name: Construir imágenes
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod build
